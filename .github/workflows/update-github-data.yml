name: Update GitHub data

# Saves profile + repository info to data/github.json so the website
# never has to call the GitHub API from a visitor's browser.
on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours
  workflow_dispatch:          # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths-ignore: ['data/**']

permissions:
  contents: write

concurrency:
  group: update-github-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch profile and repositories
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          api() {
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/$1"
          }
          api "users/$GH_USER" > /tmp/user.json
          api "users/$GH_USER/repos?per_page=100&sort=pushed" > /tmp/repos.json
          mkdir -p data
          jq -n --slurpfile u /tmp/user.json --slurpfile r /tmp/repos.json '{
            user:  ($u[0] | {login, name, public_repos, followers, following}),
            repos: [$r[0][] | {name, fork, language, description, html_url, stargazers_count, pushed_at}]
          }' > data/github.json

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data/github.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update GitHub data"
            git push
          fi
