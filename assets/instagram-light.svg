<svg xmlns="http://www.w3.org/2000/svg" width="420" height="190" viewBox="0 0 420 190" role="img" aria-label="Prashant Jangir on Instagram">
  <title>Prashant Jangir on Instagram</title>
  <defs>
    <filter id="raised" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="b"/>
      <feOffset in="b" dx="7" dy="7" result="o1"/><feFlood flood-color="#a3b1c6"/><feComposite in2="o1" operator="in" result="s1"/>
      <feOffset in="b" dx="-7" dy="-7" result="o2"/><feFlood flood-color="#ffffff"/><feComposite in2="o2" operator="in" result="s2"/>
      <feMerge><feMergeNode in="s1"/><feMergeNode in="s2"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="raisedSm" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="b"/>
      <feOffset in="b" dx="3" dy="3" result="o1"/><feFlood flood-color="#a3b1c6"/><feComposite in2="o1" operator="in" result="s1"/>
      <feOffset in="b" dx="-3" dy="-3" result="o2"/><feFlood flood-color="#ffffff"/><feComposite in2="o2" operator="in" result="s2"/>
      <feMerge><feMergeNode in="s1"/><feMergeNode in="s2"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="card" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="b"/>
      <feOffset in="b" dx="7" dy="7" result="o1"/><feFlood flood-color="#a3b1c6"/><feComposite in2="o1" operator="in" result="s1"/>
      <feOffset in="b" dx="-7" dy="-7" result="o2"/><feFlood flood-color="#ffffff"/><feComposite in2="o2" operator="in" result="s2"/>
      <feMerge><feMergeNode in="s1"/><feMergeNode in="s2"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="-4" dy="4" stdDeviation="6" flood-color="rgba(214,41,118,0.45)"/>
    </filter>
    <radialGradient id="fill" cx="0.3" cy="1.07" r="1.35"><stop offset="0" stop-color="#fdf497"/><stop offset="0.05" stop-color="#fdf497"/><stop offset="0.45" stop-color="#fd5949"/><stop offset="0.6" stop-color="#d6249f"/><stop offset="0.9" stop-color="#285aeb"/></radialGradient>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif; }
      .tilt { transform-origin: 0 0; animation: tilt 5s cubic-bezier(.2,.8,.2,1) infinite; }
      @keyframes tilt {
        0%, 16% { transform: rotate(0deg) skew(0deg); }
        30%, 70% { transform: rotate(-35deg) skew(20deg); }
        84%, 100% { transform: rotate(0deg) skew(0deg); }
      }
      
      @keyframes l1 {
        0%, 16% { transform: translate(0,0); opacity: 1; stroke: transparent; }
        30%, 70% { transform: translate(0px,-0px); opacity: 0.2; stroke: rgba(214,41,118,0.35); }
        84%, 100% { transform: translate(0,0); opacity: 1; stroke: transparent; }
      }
      .l1 { animation: l1 5s cubic-bezier(.2,.8,.2,1) infinite; }
      @keyframes l2 {
        0%, 16% { transform: translate(0,0); opacity: 1; stroke: transparent; }
        30%, 70% { transform: translate(5px,-5px); opacity: 0.4; stroke: rgba(214,41,118,0.35); }
        84%, 100% { transform: translate(0,0); opacity: 1; stroke: transparent; }
      }
      .l2 { animation: l2 5s cubic-bezier(.2,.8,.2,1) infinite; }
      @keyframes l3 {
        0%, 16% { transform: translate(0,0); opacity: 1; stroke: transparent; }
        30%, 70% { transform: translate(10px,-10px); opacity: 0.6; stroke: rgba(214,41,118,0.35); }
        84%, 100% { transform: translate(0,0); opacity: 1; stroke: transparent; }
      }
      .l3 { animation: l3 5s cubic-bezier(.2,.8,.2,1) infinite; }
      @keyframes l4 {
        0%, 16% { transform: translate(0,0); opacity: 1; stroke: transparent; }
        30%, 70% { transform: translate(15px,-15px); opacity: 0.8; stroke: rgba(214,41,118,0.35); }
        84%, 100% { transform: translate(0,0); opacity: 1; stroke: transparent; }
      }
      .l4 { animation: l4 5s cubic-bezier(.2,.8,.2,1) infinite; }
      @keyframes top {
        0%, 16% { transform: translate(0,0); }
        30%, 70% { transform: translate(20px,-20px); }
        84%, 100% { transform: translate(0,0); }
      }
      .top { animation: top 5s cubic-bezier(.2,.8,.2,1) infinite; }
      @keyframes on { 0%, 16% { opacity: 0; } 30%, 70% { opacity: 1; } 84%, 100% { opacity: 0; } }
      @keyframes off { 0%, 16% { opacity: 1; } 30%, 70% { opacity: 0; } 84%, 100% { opacity: 1; } }
      .on { animation: on 5s cubic-bezier(.2,.8,.2,1) infinite; }
      .off { animation: off 5s cubic-bezier(.2,.8,.2,1) infinite; }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <!-- surface -->
  <rect width="420" height="190" rx="28" fill="#e4e9f0"/>
  <!-- raised card -->
  <rect x="30" y="30" width="360" height="130" rx="26" fill="#e4e9f0" filter="url(#card)"/>

  <!-- layered tile -->
  <g transform="translate(112,95)">
    <g class="tilt">
      <rect class="l1" x="-30.0" y="-30.0" width="60" height="60" rx="16" fill="#e4e9f0" stroke-width="1" filter="url(#raised)"/>
      <rect class="l2" x="-30.0" y="-30.0" width="60" height="60" rx="16" fill="#e4e9f0" stroke-width="1"/>
      <rect class="l3" x="-30.0" y="-30.0" width="60" height="60" rx="16" fill="#e4e9f0" stroke-width="1"/>
      <rect class="l4" x="-30.0" y="-30.0" width="60" height="60" rx="16" fill="#e4e9f0" stroke-width="1"/>
      <g class="top">
        <rect x="-30.0" y="-30.0" width="60" height="60" rx="16" fill="#e4e9f0"/>
        <g class="on" filter="url(#glow)">
          <rect x="-30.0" y="-30.0" width="60" height="60" rx="16" fill="url(#fill)"/>
        </g>
        <g transform="translate(-12.25,-14) scale(0.05469)">
          <path class="off" d="M224.1 141c-63.6 0-114.9 51.3-114.9 114.9s51.3 114.9 114.9 114.9S339 319.5 339 255.9 287.7 141 224.1 141zm0 189.6c-41.1 0-74.7-33.5-74.7-74.7s33.5-74.7 74.7-74.7 74.7 33.5 74.7 74.7-33.6 74.7-74.7 74.7zm146.4-194.3c0 14.9-12 26.8-26.8 26.8-14.9 0-26.8-12-26.8-26.8s12-26.8 26.8-26.8 26.8 12 26.8 26.8zm76.1 27.2c-1.7-35.9-9.9-67.7-36.2-93.9-26.2-26.2-58-34.4-93.9-36.2-37-2.1-147.9-2.1-184.9 0-35.8 1.7-67.6 9.9-93.9 36.1s-34.4 58-36.2 93.9c-2.1 37-2.1 147.9 0 184.9 1.7 35.9 9.9 67.7 36.2 93.9s58 34.4 93.9 36.2c37 2.1 147.9 2.1 184.9 0 35.9-1.7 67.7-9.9 93.9-36.2 26.2-26.2 34.4-58 36.2-93.9 2.1-37 2.1-147.8 0-184.8zM398.8 388c-7.8 19.6-22.9 34.7-42.6 42.6-29.5 11.7-99.5 9-132.1 9s-102.7 2.6-132.1-9c-19.6-7.8-34.7-22.9-42.6-42.6-11.7-29.5-9-99.5-9-132.1s-2.6-102.7 9-132.1c7.8-19.6 22.9-34.7 42.6-42.6 29.5-11.7 99.5-9 132.1-9s102.7-2.6 132.1 9c19.6 7.8 34.7 22.9 42.6 42.6 11.7 29.5 9 99.5 9 132.1s2.7 102.7-9 132.1z" fill="#d62976"/>
          <path class="on" d="M224.1 141c-63.6 0-114.9 51.3-114.9 114.9s51.3 114.9 114.9 114.9S339 319.5 339 255.9 287.7 141 224.1 141zm0 189.6c-41.1 0-74.7-33.5-74.7-74.7s33.5-74.7 74.7-74.7 74.7 33.5 74.7 74.7-33.6 74.7-74.7 74.7zm146.4-194.3c0 14.9-12 26.8-26.8 26.8-14.9 0-26.8-12-26.8-26.8s12-26.8 26.8-26.8 26.8 12 26.8 26.8zm76.1 27.2c-1.7-35.9-9.9-67.7-36.2-93.9-26.2-26.2-58-34.4-93.9-36.2-37-2.1-147.9-2.1-184.9 0-35.8 1.7-67.6 9.9-93.9 36.1s-34.4 58-36.2 93.9c-2.1 37-2.1 147.9 0 184.9 1.7 35.9 9.9 67.7 36.2 93.9s58 34.4 93.9 36.2c37 2.1 147.9 2.1 184.9 0 35.9-1.7 67.7-9.9 93.9-36.2 26.2-26.2 34.4-58 36.2-93.9 2.1-37 2.1-147.8 0-184.8zM398.8 388c-7.8 19.6-22.9 34.7-42.6 42.6-29.5 11.7-99.5 9-132.1 9s-102.7 2.6-132.1-9c-19.6-7.8-34.7-22.9-42.6-42.6-11.7-29.5-9-99.5-9-132.1s-2.6-102.7 9-132.1c7.8-19.6 22.9-34.7 42.6-42.6 29.5-11.7 99.5-9 132.1-9s102.7-2.6 132.1 9c19.6 7.8 34.7 22.9 42.6 42.6 11.7 29.5 9 99.5 9 132.1s2.7 102.7-9 132.1z" fill="#ffffff"/>
        </g>
      </g>
    </g>
  </g>

  <!-- text -->
  <text x="176" y="80" font-size="19" font-weight="700" fill="#31344b">Prashant Jangir</text>
  <text x="176" y="102" font-size="13" fill="#7b8499">@prashantjangir_22</text>

  <!-- action pill -->
  <g transform="translate(176,114)">
    <rect width="94" height="30" rx="15" fill="#e4e9f0" filter="url(#raisedSm)"/>
    <g class="on"><rect width="94" height="30" rx="15" fill="url(#fill)"/></g>
    <text class="off" x="47" y="20" font-size="13" font-weight="600" text-anchor="middle" fill="#d62976">Follow →</text>
    <text class="on" x="47" y="20" font-size="13" font-weight="600" text-anchor="middle" fill="#ffffff">Follow →</text>
  </g>
</svg>
