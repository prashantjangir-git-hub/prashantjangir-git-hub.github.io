<svg xmlns="http://www.w3.org/2000/svg" width="300" height="285" viewBox="0 0 300 285" role="img" aria-label="Prashant Jangir on Email">
  <title>Prashant Jangir · Email</title>
  <defs>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="5" dy="5" stdDeviation="7" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="-1" dy="1" stdDeviation="2" flood-color="#f5a623" flood-opacity="0.9"/>
    </filter>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      @keyframes tip { 0%, 14% { transform: translateY(46px); opacity: 0; } 30%, 72% { transform: translateY(0); opacity: 1; } 88%, 100% { transform: translateY(46px); opacity: 0; } }
      .tip { animation: tip 5s cubic-bezier(.25,.8,.25,1) 0.8s infinite both; }
      @keyframes tilt { 0%, 14% { transform: rotate(0deg) skew(0deg); } 30%, 72% { transform: rotate(-35deg) skew(20deg); } 88%, 100% { transform: rotate(0deg) skew(0deg); } }
      .tilt { transform-origin: 0 0; animation: tilt 5s cubic-bezier(.25,.8,.25,1) 0.8s infinite both; }
      @keyframes l1 { 0%, 14% { transform: translate(0,0); opacity: 1; } 30%, 72% { transform: translate(0px,-0px); opacity: 0.2; } 88%, 100% { transform: translate(0,0); opacity: 1; } } .l1 { animation: l1 5s cubic-bezier(.25,.8,.25,1) 0.8s infinite both; }
      @keyframes l2 { 0%, 14% { transform: translate(0,0); opacity: 1; } 30%, 72% { transform: translate(5px,-5px); opacity: 0.4; } 88%, 100% { transform: translate(0,0); opacity: 1; } } .l2 { animation: l2 5s cubic-bezier(.25,.8,.25,1) 0.8s infinite both; }
      @keyframes l3 { 0%, 14% { transform: translate(0,0); opacity: 1; } 30%, 72% { transform: translate(10px,-10px); opacity: 0.6; } 88%, 100% { transform: translate(0,0); opacity: 1; } } .l3 { animation: l3 5s cubic-bezier(.25,.8,.25,1) 0.8s infinite both; }
      @keyframes l4 { 0%, 14% { transform: translate(0,0); opacity: 1; } 30%, 72% { transform: translate(15px,-15px); opacity: 0.8; } 88%, 100% { transform: translate(0,0); opacity: 1; } } .l4 { animation: l4 5s cubic-bezier(.25,.8,.25,1) 0.8s infinite both; }
      @keyframes top { 0%, 14% { transform: translate(0,0); } 30%, 72% { transform: translate(20px,-20px); } 88%, 100% { transform: translate(0,0); } }
      .top { animation: top 5s cubic-bezier(.25,.8,.25,1) 0.8s infinite both; }
      @keyframes lbl { 0%, 14% { transform: translateY(-30px); opacity: 0; } 30%, 72% { transform: translateY(0); opacity: 1; } 88%, 100% { transform: translateY(-30px); opacity: 0; } }
      .lbl { animation: lbl 5s cubic-bezier(.25,.8,.25,1) 0.8s infinite both; }
      @keyframes glw { 0%, 14% { opacity: 0; } 30%, 72% { opacity: 1; } 88%, 100% { opacity: 0; } }
      .glw { animation: glw 5s cubic-bezier(.25,.8,.25,1) 0.8s infinite both; }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .tip, .lbl { opacity: 1; transform: none; } }
    </style>
  </defs>

  <!-- profile tooltip -->
  <g class="tip">
    <rect x="10" y="10" width="280" height="114" rx="15" fill="#1e1f22" filter="url(#drop)"/>
    <rect x="10.5" y="10.5" width="279" height="113" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="20" y="20" width="260" height="94" rx="12" fill="#2a2b2f" stroke="rgb(11,63,95)"/>
    <rect x="30" y="30" width="50" height="50" rx="10" fill="#ffffff" stroke="#f5a623"/>
    <text x="55" y="64" font-size="22" font-weight="700" text-anchor="middle" fill="#000">PJ</text>
    <text x="90" y="51" font-size="16" font-weight="700" fill="#f5a623">Prashant Jangir</text>
    <text x="90" y="70" font-size="11.5" fill="#ffffff">prashant.jangir@iitgn.ac.in</text>
    <text x="30" y="102" font-size="13" fill="#cccccc">Drop me a mail</text>
  </g>

  <!-- layered icon -->
  <g transform="translate(150,200)">
    <g class="tilt">
      <rect class="l1" x="-27.5" y="-27.5" width="55" height="55" rx="5" fill="none" stroke="#f5a623" stroke-width="1.2"/>
      <rect class="l2" x="-27.5" y="-27.5" width="55" height="55" rx="5" fill="none" stroke="#f5a623" stroke-width="1.2"/>
      <rect class="l3" x="-27.5" y="-27.5" width="55" height="55" rx="5" fill="none" stroke="#f5a623" stroke-width="1.2"/>
      <rect class="l4" x="-27.5" y="-27.5" width="55" height="55" rx="5" fill="none" stroke="#f5a623" stroke-width="1.2"/>
      <g class="top">
        <rect class="glw" x="-27.5" y="-27.5" width="55" height="55" rx="5" fill="#000" filter="url(#glow)"/>
        <rect x="-27.5" y="-27.5" width="55" height="55" rx="5" fill="#000" stroke="#f5a623" stroke-width="1.2"/>
        <g transform="translate(-13.00,-13.0) scale(0.05078)">
          <path d="M48 64C21.5 64 0 85.5 0 112c0 15.1 7.1 29.3 19.2 38.4L236.8 313.6c11.4 8.5 27 8.5 38.4 0L492.8 150.4c12.1-9.1 19.2-23.3 19.2-38.4c0-26.5-21.5-48-48-48H48zM0 176V384c0 35.3 28.7 64 64 64H448c35.3 0 64-28.7 64-64V176L294.4 339.2c-22.8 17.1-54 17.1-76.8 0L0 176z" fill="#f5a623"/>
        </g>
      </g>
    </g>
  </g>

  <!-- label -->
  <text class="lbl" x="150" y="261.5" font-size="16" font-weight="600" text-anchor="middle" fill="#f5a623">Email</text>
</svg>
