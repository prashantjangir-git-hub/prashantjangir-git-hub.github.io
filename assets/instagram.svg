<svg xmlns="http://www.w3.org/2000/svg" width="300" height="285" viewBox="0 0 300 285" role="img" aria-label="Prashant Jangir on Instagram">
  <title>Prashant Jangir · Instagram</title>
  <defs>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="5" dy="5" stdDeviation="7" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="-1" dy="1" stdDeviation="2" flood-color="#e1306c" flood-opacity="0.9"/>
    </filter>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      @keyframes tip { 0%, 14% { transform: translateY(46px); opacity: 0; } 30%, 72% { transform: translateY(0); opacity: 1; } 88%, 100% { transform: translateY(46px); opacity: 0; } }
      .tip { animation: tip 5s cubic-bezier(.25,.8,.25,1) 0.4s infinite both; }
      @keyframes tilt { 0%, 14% { transform: rotate(0deg) skew(0deg); } 30%, 72% { transform: rotate(-35deg) skew(20deg); } 88%, 100% { transform: rotate(0deg) skew(0deg); } }
      .tilt { transform-origin: 0 0; animation: tilt 5s cubic-bezier(.25,.8,.25,1) 0.4s infinite both; }
      @keyframes l1 { 0%, 14% { transform: translate(0,0); opacity: 1; } 30%, 72% { transform: translate(0px,-0px); opacity: 0.2; } 88%, 100% { transform: translate(0,0); opacity: 1; } } .l1 { animation: l1 5s cubic-bezier(.25,.8,.25,1) 0.4s infinite both; }
      @keyframes l2 { 0%, 14% { transform: translate(0,0); opacity: 1; } 30%, 72% { transform: translate(5px,-5px); opacity: 0.4; } 88%, 100% { transform: translate(0,0); opacity: 1; } } .l2 { animation: l2 5s cubic-bezier(.25,.8,.25,1) 0.4s infinite both; }
      @keyframes l3 { 0%, 14% { transform: translate(0,0); opacity: 1; } 30%, 72% { transform: translate(10px,-10px); opacity: 0.6; } 88%, 100% { transform: translate(0,0); opacity: 1; } } .l3 { animation: l3 5s cubic-bezier(.25,.8,.25,1) 0.4s infinite both; }
      @keyframes l4 { 0%, 14% { transform: translate(0,0); opacity: 1; } 30%, 72% { transform: translate(15px,-15px); opacity: 0.8; } 88%, 100% { transform: translate(0,0); opacity: 1; } } .l4 { animation: l4 5s cubic-bezier(.25,.8,.25,1) 0.4s infinite both; }
      @keyframes top { 0%, 14% { transform: translate(0,0); } 30%, 72% { transform: translate(20px,-20px); } 88%, 100% { transform: translate(0,0); } }
      .top { animation: top 5s cubic-bezier(.25,.8,.25,1) 0.4s infinite both; }
      @keyframes lbl { 0%, 14% { transform: translateY(-30px); opacity: 0; } 30%, 72% { transform: translateY(0); opacity: 1; } 88%, 100% { transform: translateY(-30px); opacity: 0; } }
      .lbl { animation: lbl 5s cubic-bezier(.25,.8,.25,1) 0.4s infinite both; }
      @keyframes glw { 0%, 14% { opacity: 0; } 30%, 72% { opacity: 1; } 88%, 100% { opacity: 0; } }
      .glw { animation: glw 5s cubic-bezier(.25,.8,.25,1) 0.4s infinite both; }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .tip, .lbl { opacity: 1; transform: none; } }
    </style>
  </defs>

  <!-- profile tooltip -->
  <g class="tip">
    <rect x="10" y="10" width="280" height="114" rx="15" fill="#1e1f22" filter="url(#drop)"/>
    <rect x="10.5" y="10.5" width="279" height="113" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="20" y="20" width="260" height="94" rx="12" fill="#2a2b2f" stroke="rgb(11,63,95)"/>
    <rect x="30" y="30" width="50" height="50" rx="10" fill="#ffffff" stroke="#e1306c"/>
    <text x="55" y="64" font-size="22" font-weight="700" text-anchor="middle" fill="#000">PJ</text>
    <text x="90" y="51" font-size="16" font-weight="700" fill="#e1306c">Prashant Jangir</text>
    <text x="90" y="70" font-size="11.5" fill="#ffffff">@prashantjangir_22</text>
    <text x="30" y="102" font-size="13" fill="#cccccc">Follow along</text>
  </g>

  <!-- layered icon -->
  <g transform="translate(150,200)">
    <g class="tilt">
      <rect class="l1" x="-27.5" y="-27.5" width="55" height="55" rx="5" fill="none" stroke="#e1306c" stroke-width="1.2"/>
      <rect class="l2" x="-27.5" y="-27.5" width="55" height="55" rx="5" fill="none" stroke="#e1306c" stroke-width="1.2"/>
      <rect class="l3" x="-27.5" y="-27.5" width="55" height="55" rx="5" fill="none" stroke="#e1306c" stroke-width="1.2"/>
      <rect class="l4" x="-27.5" y="-27.5" width="55" height="55" rx="5" fill="none" stroke="#e1306c" stroke-width="1.2"/>
      <g class="top">
        <rect class="glw" x="-27.5" y="-27.5" width="55" height="55" rx="5" fill="#000" filter="url(#glow)"/>
        <rect x="-27.5" y="-27.5" width="55" height="55" rx="5" fill="#000" stroke="#e1306c" stroke-width="1.2"/>
        <g transform="translate(-11.38,-13.0) scale(0.05078)">
          <path d="M224.1 141c-63.6 0-114.9 51.3-114.9 114.9s51.3 114.9 114.9 114.9S339 319.5 339 255.9 287.7 141 224.1 141zm0 189.6c-41.1 0-74.7-33.5-74.7-74.7s33.5-74.7 74.7-74.7 74.7 33.5 74.7 74.7-33.6 74.7-74.7 74.7zm146.4-194.3c0 14.9-12 26.8-26.8 26.8-14.9 0-26.8-12-26.8-26.8s12-26.8 26.8-26.8 26.8 12 26.8 26.8zm76.1 27.2c-1.7-35.9-9.9-67.7-36.2-93.9-26.2-26.2-58-34.4-93.9-36.2-37-2.1-147.9-2.1-184.9 0-35.8 1.7-67.6 9.9-93.9 36.1s-34.4 58-36.2 93.9c-2.1 37-2.1 147.9 0 184.9 1.7 35.9 9.9 67.7 36.2 93.9s58 34.4 93.9 36.2c37 2.1 147.9 2.1 184.9 0 35.9-1.7 67.7-9.9 93.9-36.2 26.2-26.2 34.4-58 36.2-93.9 2.1-37 2.1-147.8 0-184.8zM398.8 388c-7.8 19.6-22.9 34.7-42.6 42.6-29.5 11.7-99.5 9-132.1 9s-102.7 2.6-132.1-9c-19.6-7.8-34.7-22.9-42.6-42.6-11.7-29.5-9-99.5-9-132.1s-2.6-102.7 9-132.1c7.8-19.6 22.9-34.7 42.6-42.6 29.5-11.7 99.5-9 132.1-9s102.7-2.6 132.1 9c19.6 7.8 34.7 22.9 42.6 42.6 11.7 29.5 9 99.5 9 132.1s2.7 102.7-9 132.1z" fill="#e1306c"/>
        </g>
      </g>
    </g>
  </g>

  <!-- label -->
  <text class="lbl" x="150" y="261.5" font-size="16" font-weight="600" text-anchor="middle" fill="#e1306c">Instagram</text>
</svg>
